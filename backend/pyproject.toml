[project]
name = "diary-agent"
version = "0.1.0"
description = "Local-first chat journal agent built with LangChain + LangGraph + Ollama"
authors = [
    { name = "Beastarz", email = "jygoh1453@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
diary = "diary_agent.cli.app:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
