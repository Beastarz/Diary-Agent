# Workspace root. The app lives in backend/ (and later frontend/).
# One lock file and one .venv here, so `uv run diary chat`, `uv run pytest` and
# `uv run python evals/...` all work from the repo root.
[project]
name = "diary-agent-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["diary-agent"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
diary-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "evals/tests"]
pythonpath = ["evals"]  # so evals/tests can import evaluators and suites, as run_evals.py does
